# RRAI Knowledge Manifest
#
# Authority: governed — subordinate to 00_RRAI_Master_Context_v2_0.md
# Purpose:   Machine-readable registry classifying every knowledge asset.
#            The server uses this manifest to determine which assets may be
#            supplied to an LLM and under which lens/sensitivity conditions.
#
# Rules:
#   - Only assets listed here may be supplied to the model.
#   - Unknown or unregistered files must never reach prompt assembly.
#   - `supplied_to_llm: false` assets are indexed but never sent to the model.
#   - `status: placeholder` assets are always excluded from model context.
#   - Partition and sensitivity filters are applied independently; the more
#     restrictive rule wins.
#
# Partitions:
#   neutral      — available to all permitted lenses
#   intelligence — available to analyst + intelligence + commercial + delivery
#   commercial   — available to commercial + delivery only
#   delivery     — available to delivery only
#   restricted   — never supplied to the model
#
# Sensitivity levels (ascending restriction):
#   public | internal | confidential | highly_restricted
#
# Policy version: lens-policy-v1

manifest_version: "1"
policy_version: "lens-policy-v1"
knowledge_dir: "knowledge"

